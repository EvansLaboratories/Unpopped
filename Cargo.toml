[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The Unpopped contributors"]
repository = "https://github.com/EvansLaboratories/Unpopped"
homepage = "https://github.com/EvansLaboratories/Unpopped"
# Deliberately vendor-NEUTRAL: Unpopped is the kernel generator + the neutral
# vocabulary, not a CUDA project. Device/vendor backends live under their own
# identities (`baracuda-*`, `vulkane-*`) and depend on these crates, never the
# other way round. Keep CUDA/NVIDIA terms out of this metadata.
keywords = ["kernel", "codegen", "compiler", "gpu", "ir"]
categories = ["compilers", "development-tools", "science"]

[workspace.dependencies]
# Unpopped's own crates — path + version so they can be published independently.
unpopped-vocab = { path = "crates/unpopped-vocab", version = "0.3.2" }
unpopped = { path = "crates/unpopped", version = "0.8.0" }
# The reference emitters. Each depends on `unpopped`, never the reverse — the
# core holds the standard and the traits; a target holds its own spelling.
unpopped-cpu-c = { path = "crates/unpopped-cpu-c", version = "0.6.0" }
unpopped-slang = { path = "crates/unpopped-slang", version = "0.6.0" }
# Dtype primitives. Versions match the Baracuda workspace the vocabulary was
# carved from, so the extracted crate resolves identically on either side of the
# split until it is published.
half = { version = "2", default-features = false }
float8 = { version = "0.7", default-features = false }

# Materialized from the Baracuda workspace at extraction time (Baracuda promoted
# missing_docs warn -> deny after a workspace-wide docs sweep took it to zero;
# the extracted crates were written under that posture, so keeping it deny is
# what makes them build unchanged).
[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

# Doc links are part of the published artifact: a broken one renders as plain
# text on docs.rs, and a link into a private item renders as nothing at all.
# Both were live here — 27 of them across three crates, including a module
# header that documented an `OperandDesc::quant` field removed a release
# earlier. Nothing had failed, because nothing ran `cargo doc`.
#
# Denied rather than warned so the next one stops a build instead of joining a
# pile nobody reads. Note the reach: this fires for whoever runs `cargo doc`,
# and there is no CI in this repo to run it for them.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
# Pragmatic clippy posture: warn loud, but no draconian style enforcement.
all = { level = "warn", priority = -1 }
# Allow the patterns that idiomatic Rust at scale uses heavily:
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
