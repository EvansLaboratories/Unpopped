# The first automated verification this repository has ever had.
#
# There has never been a `.github/` directory here — not removed, never added, in
# the whole history. Until 2026-08-21 nothing but a local run had ever compiled a
# pushed commit, in the one workspace in the portfolio that publishes to a
# registry with no delete. At `672d938` — the commit `unpopped 0.5.0` and both
# emitters shipped from — `cargo fmt --check` exited 1 and `cargo doc` threw 37
# warnings. That is the concrete instance behind this file.
#
# WHAT THIS COVERS, AND WHAT IT DOES NOT
#
# It covers: fmt, clippy, the test suite, and docs, on default features, on
# Linux; and clippy + tests again under `--all-features` (see the `all-features`
# job). It does NOT cover Windows or any device backend.
#
# `--all-features` WAS excluded here until 2026-09-02, and the exclusion was
# costing more than the CI minutes it saved. Measured: 734 `#[test]` functions
# exist in this workspace and 712 ran, because `convert` is off by default and
# its 20 tests went with it. Worse, `#[cfg(feature = "seam")] pub mod seam` in
# `crates/unpopped/src/jit.rs` — the entry point Fuel and Baracuda actually call
# — was never COMPILED by CI at all, so a breaking change to its frozen grammar
# dep would have landed green here and failed in their tree instead of ours.
#
# An optional feature is not optional to the consumer who enables it. The cost
# of this job is one tree-sitter build; the cost of not having it was that the
# cross-repo seam was the least-verified code in the repository.
#
# BOTH TRIGGERS DECLARED BELOW ARE EXERCISED. To get the current split rather
# than a number that rots in this comment:
#
#   gh api repos/EvansLaboratories/Unpopped/actions/workflows/verify.yml/runs --paginate --jq '.workflow_runs[].event' | sort | uniq -c
#
# ⚠️ THIS NOTE ONCE CARRIED A COUNT, AND THE COUNT IS WHY IT WENT WRONG. It read
# "THE `pull_request:` TRIGGER HAS NEVER FIRED — measured 2026-08-26: five runs,
# all `push`, and zero pull requests have ever existed in this repository."
# True when written. False by the time anyone read it again, because PRs opened.
#
# ⚠️ AND IT WAS FALSIFIED BY AN EVENT THAT PRODUCES NO DIFF AT ALL. A stale
# comment is normally broken by a commit touching its neighbourhood; this one was
# broken by a pull request EXISTING. No diff anywhere contained the change that
# made it false, so no diff-scoped review could have caught it.
#
# ⚠️ THE FIRST FIX FOR IT WAS A FRESHER COUNT — "most recent 100 of 131 runs:
# pull_request 12, push 88" — which is the same defect with a later timestamp. A
# reviewer caught that on the PR. A COUNT CANNOT SURVIVE TREE GROWTH; A PROPERTY
# CAN, and where a comment wants a number, the command that produces it is always
# current while the number never is.
#
# The underlying rule stands and is why the note was written: A DECLARED TRIGGER
# IS NOT AN EXERCISED ONE. Baracuda hit the neighbouring version the same day —
# their workflow fired only on PRs to `main`, so a stacked PR was judged by
# nothing and looked clean.
#
# Naming that matters more than the coverage does. Most of what this repository
# found on 2026-08-20 was GREEN-PASSING — a version divergence between tree and
# registry, a non-canonical licence file, 22 tests sitting in the wrong crate, a
# plan gate that aborted on malformed input. A job like this catches none of
# those. It catches the two cheap checks that were failing at a published commit,
# and calling it "verified" would be the defect this repository spent a day
# cataloguing.
name: verify

on:
  push:
  pull_request:

# The token gets read access to the repository contents and nothing else. Every
# job below checks out, builds and tests, and none of them writes to the forge,
# so a job that needs more must say so itself rather than inherit it. Without
# this block the token carries the repository's default, which is broader.
# There are no service-container images in this workflow, so there is nothing
# to pin by digest or waive (SUP-008's `unpinned-images`).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The toolchain is NOT named here. `rustup` reads `rust-toolchain.toml`, so the
  # pinned version lives in exactly one place and this job cannot disagree with
  # it. A duplicated fact with no gate on the duplication is a scheduled
  # divergence — the cheaper fix is not to duplicate it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain   # prints what rust-toolchain.toml resolved to
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  # `rust-version` in Cargo.toml is a promise published in every crate here, and
  # until 2026-08-21 nobody had ever built against it. This job READS the
  # declaration rather than restating it, so the thing under test and the thing
  # declared cannot drift apart.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - run: cargo +${{ steps.msrv.outputs.version }} test --workspace

  # THE OPTIONAL FEATURES, WHICH NOTHING ELSE HERE COMPILES.
  #
  # Separate from `verify` rather than folded into it: this one builds
  # tree-sitter grammars through `cc` and is the slow job, and keeping it
  # separate means a failure names WHICH surface broke without reading logs.
  #
  # `--all-features` turns on `convert` (the CUDA/Slang tree-sitter frontends),
  # which is not in `default`, so without this job it is not type-checked,
  # linted, or tested by anything that runs automatically. (It also turned on
  # `seam` until 0.12.0, which removed that feature and its
  # `fuel-kernel-seam-types` dependency.)
  all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features

  # DEPENDENCY AUDIT: advisories, licences, bans, sources (`deny.toml`).
  #
  # The licence allow list is read from `cargo deny --all-features list`, so a new
  # dependency with an unlisted licence fails here rather than at a consumer. An
  # advisory acknowledgement is the PM's call at gate, never a config edit.
  #
  # THIRD-PARTY ACTIONS ARE PINNED BY FULL COMMIT SHA, with the tag in a trailing
  # comment. Both SHAs were read from the actions' own repositories on 2026-10-11
  # (an annotated tag is peeled to its commit; `v7` and `v7.0.1` resolve to the
  # same one). A tag can be moved after the fact; a SHA cannot.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # PUBLISHED-VS-WORKSPACE DIVERGENCE (issue #4, the class). An in-tree build resolves the
  # workspace crates by path and a consumer resolves only the registry, so a commit made to a
  # version AFTER it was published is invisible to both. This job fetches each published crate at the
  # version Cargo.toml declares and fails if its `src/` differs. A version not on the registry yet
  # passes (it cannot have diverged from itself); a registry or network error fails. The script
  # carries its own known-bad control: an injected line must move the differing count 0 -> 1.
  divergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/published_divergence.sh

  # ADVISORY (CireSnave 2026-10-23: "Roll out advisory-only, non-blocking CodeRipper
  # checks everywhere."). Not a required check; no rule is silenced here.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@a48fc6cc4726abf21d28fba0525c9e15aef96aff
