[package]
name = "unpopped-vocab"
version = "0.1.0"
description = "The driver-free classifier vocabulary for kernel generation: pure-data dispatch tags (ElementKind, ArchSku, OpCategory, layout / op-family tags), the StructureKey / OperandDesc classifier key and its `structure_key` derivation, the dispatch-table types, the PlanPreference / PrecisionGuarantee descriptors, and the DeviceRepr memory-layout marker. Vendor-neutral and device-free: it depends on no backend, no driver, and no vendor crate, so generators, selectors and runtimes can share one vocabulary without inheriting anyone's device stack. Extracted from the Baracuda workspace, where it was developed as baracuda-kernel-vocab."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kernel", "vocabulary", "codegen", "dispatch", "dtype"]
categories = ["development-tools", "science"]

[dependencies]
# The half / float8 dtype primitives the KernelDtype hierarchy is built on.
# These are the crate's ONLY dependencies: it owns DeviceRepr (see `device_repr`)
# rather than borrowing it, so nothing vendor-specific is in its graph. Device
# and vendor crates depend on this vocabulary, never the reverse.
half = { workspace = true }
float8 = { workspace = true }

[lints]
workspace = true
