[package]
name = "unpopped"
version = "0.3.0"
description = "A vendor-neutral kernel generator: the backend-agnostic IR, plan, transform pipeline, contracts and dispatch artifacts, plus the `Backend` and `Compiler` traits a target implements. Ships a portable-C99 reference backend and a CPU oracle, so it builds and self-tests with no device, no driver, and no vendor dependency. Device backends live under their own vendor identity and depend on this crate — the CUDA emitter, its NVRTC compiler and the Fuel synthesizer live in `baracuda-cuda-emit`. Pre-1.0 and moving; pin exact versions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kernel", "codegen", "compiler", "gpu", "ir"]
categories = ["compilers", "development-tools", "science"]
readme = "README.md"
# License texts are duplicated into this crate directory so they ship inside the
# published tarball. Cargo cannot package files above the crate root, so a
# workspace-root-only copy would leave the crate on crates.io carrying no license
# text -- which Apache-2.0 section 4(a) requires recipients to receive. The SPDX
# expression above stays authoritative; `license-file` is deliberately NOT set,
# since it names a single file and this crate is dual-licensed.

[features]
# Wire Fuel's frozen kernel-seam grammar (`fuel_kernel_seam_types::PatternNode`) as
# the neutral seam front-end's JIT region type. The live-call envelope
# (`fuel_kernel_seam::Synthesizer`, `BaracudaSynthesizer`) lives in
# `baracuda-cuda-emit`, so this crate keeps only the `-types` grammar dep.
#
# OFF by default: it is a consumer-specific protocol dep, and the default build of
# a vendor-neutral generator carries no consumer's vocabulary.
seam = ["dep:fuel-kernel-seam-types"]
# The source-language CONVERTERS (IR-hub Phase 4): tree-sitter frontends that lift
# existing CUDA / Slang kernels into the neutral IR. Optional so the published
# default build stays lean — the grammars compile C via the `cc` crate; enable with
# `--features convert`.
convert = ["dep:tree-sitter", "dep:tree-sitter-cuda", "dep:tree-sitter-slang"]

[dependencies]
unpopped-vocab = { workspace = true }
# Accurate f64 transcendentals (erf/erfc) for the CPU oracle reference — a pure-Rust
# (MUSL/fdlibm heritage) implementation INDEPENDENT of any emitter's device erf/erff,
# so it remains a valid differential oracle. Replaces the v1 ~1e-7 rational that was
# too loose to reference an f32/f64 erf/gelu kernel (adversarial review).
libm = "0.2"
# Fuel's dependency-free std-POD grammar crate (OpTag / OpAttrs / PatternNode) — the
# §5 shared wire vocabulary. crates.io version dep so the default build resolves
# without a Fuel checkout (an unpublished path/git dep breaks workspace resolution).
fuel-kernel-seam-types = { version = "0.10.3", optional = true }
# Human-readable / -writable IR text form (IR-hub Phase 3): the neutral `OpDef`
# IR derives Serialize/Deserialize so an op can be authored/inspected/diffed as
# pretty JSON and round-tripped (see `src/text.rs`, `op_to_text`/`op_from_text`).
# Plain (non-optional) deps: the round-trip surface is always available and the
# `--lib` tests exercise it under the default feature set.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Converter frontends (`convert` feature): reuse mature tree-sitter grammars to lift
# CUDA / Slang source into the IR instead of hand-writing parsers. Error-tolerant
# CSTs — unrecognized constructs stay as residue (the "keep the rest in the source
# language" contract). tree-sitter-cuda extends tree-sitter-cpp; tree-sitter-slang
# extends tree-sitter-cpp + tree-sitter-hlsl.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-cuda = { version = "0.21", optional = true }
tree-sitter-slang = { version = "0.3", optional = true }

[dev-dependencies]
# kiss-ref: the spec-exact KISS reference impl — the single source of truth this
# crate's numerical tests assert against (the oracle.rs consolidation). DEV-only,
# so it is NOT in the published lib's dependency graph and `cargo publish` stays
# clean. The in-tree `kiss_ref_diff` #[cfg(test)] module converts an emitted recipe
# to a kiss-ref FlatDag and diffs eval_recipe.
#
# Deliberately an INDEPENDENT implementation rather than a shared dependency: three
# independent `structure_key` derivations byte-matching is conformance evidence about
# the SPEC. A shared crate would make that agreement a tautology. Inert token tables
# may be shared; derivations are not.
kiss-ref-core = "0.2.3"
kiss-ops-vocab = "0.2.3"
kiss-classify-vocab = "0.2.3"

[lints]
workspace = true
